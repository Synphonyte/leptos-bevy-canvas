[workspace]
resolver = "2"

members = ["loading_screen", "synced_bevy_query", "unidir_messages"]

[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
bevy-inspector-egui = "0.37"
bevy_panorbit_camera = "0.35"
console_error_panic_hook = "0.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
leptos = { version = "0.8", features = ["csr"] }
leptos-bevy-canvas = { path = "../../leptos-bevy-canvas", features = [
    "bevy_state",
] }
leptos-use = "0.19"
rand_core = "0.10"
uuid = { version = "1", features = ["rng-getrandom"] }

[package]
edition = "2024"
name = "leptos-bevy-canvas-examples"
version = "0.3.3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
