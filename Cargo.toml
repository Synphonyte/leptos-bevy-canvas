[package]
categories = ["graphics", "gui", "rendering", "wasm", "web-programming"]
description = "Embed an idiomatic Bevy app inside your Leptos app with ease."
edition = "2021"
exclude = ["examples/", "tests/"]
keywords = ["bevy", "canvas", "graphics", "leptos", "wasm"]
license = "MIT OR Apache-2.0"
name = "leptos-bevy-canvas"
readme = "README.md"
repository = "https://github.com/Synphonyte/leptos-bevy-canvas"
version = "0.6.0"

[dependencies]
bevy = { version = "0.19", default-features = false }
crossbeam-channel = "0.5"
leptos = "0.8"
leptos-use = { version = "0.19", default-features = false, features = [
    "use_raf_fn",
] }
paste = "1.0.15"
variadics_please = "2"

[dev-dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_window",
] }

[features]
bevy_state = ["bevy/bevy_state"]
